services:
  kanca:
    build: .
    env_file: .env
    expose:
      - "8000"           # yalnızca iç ağ; dışarıya Caddy açar
    ports:
      - "53:53/udp"      # DNS yakalama (doğrudan, proxy'siz)
      - "53:53/tcp"
      - "25:25/tcp"      # SMTP yakalama (sağlayıcı 25'i açıksa)
      - "389:389/tcp"    # LDAP yakalama (Log4Shell/JNDI OOB)
    volumes:
      - ./data:/app/data # SQLite kalıcılığı
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - kanca
    ports:
      - "80:80"          # ACME HTTP-01 + HTTP yakalama (*.oob)
      - "443:443"        # Panel HTTPS
    environment:
      PANEL_HOST: ${PANEL_DOMAIN}
      CAPTURE_HOST: ${BASE_DOMAIN}
      CERT_NAME: ${CERT_NAME:-oob}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./letsencrypt:/letsencrypt:ro   # certbot'un ürettiği wildcard sertifika
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Wildcard (*.oob) TLS için Let's Encrypt DNS-01 sertifikası.
  # Otomatik başlamaz; elle çalıştırılır (bkz. README):
  #   docker compose run --rm certbot certonly ...
  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - ./data:/data                    # acme_challenge.txt'yi DNS ile paylaşır
      - ./letsencrypt:/etc/letsencrypt
      - ./acme:/hooks:ro

volumes:
  caddy_data:
  caddy_config:
