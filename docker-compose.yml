services:
  kanca:
    build: .
    env_file: .env
    expose:
      - "8000"           # yalnızca iç ağ; dışarıya Caddy açar
    ports:
      - "53:53/udp"      # DNS yakalama (doğrudan, proxy'siz)
      - "53:53/tcp"
      - "25:25/tcp"      # SMTP yakalama (sağlayıcı 25'i açıksa)
      - "389:389/tcp"    # LDAP yakalama (Log4Shell/JNDI OOB)
    volumes:
      - ./data:/app/data # SQLite kalıcılığı
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - kanca
    ports:
      - "80:80"          # ACME HTTP-01 + HTTP yakalama (*.oob)
      - "443:443"        # Panel HTTPS
    environment:
      PANEL_HOST: ${PANEL_DOMAIN}
      CAPTURE_HOST: ${BASE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
